# Stonegrove Hub cast bible. OUT OF WORLD. Never shipped.
#
# Every named person in the estate is here. Documents reference people by `id`.
# Names are drawn from config/clan_name_pools.yaml (forename pool for the clan
# and gender, surname pool for the clan). Do not invent names outside the pools.
#
# Pronouns are assigned here as part of authoring the character; use them
# consistently in every document.
#
# Contact details are always safe pretend values:
#   email    forename.surname@stonegrove.ac.example   (.example is a reserved TLD)
#   landline 01632 960000 to 01632 960999             (Ofcom drama range)
#   mobile   07700 900000 to 07700 900999             (Ofcom drama range)
#   ext      four digits
# The build lints for any other domain or any UK-looking number.

snapshot_date: 1053-04-14
institution:
  name: Stonegrove University
  email_domain: stonegrove.ac.example
  switchboard: 01632 960000
  postal_address: "Stonegrove University, The Cloisters, Greywater Vale"
  former_name: Stonegrove College of the Vale   # retired at the 1051 rebrand; still turns up
  intranet_name: Stonegrove Hub
  legacy_drive_name: StoneShare                 # the old network drive, migrated November 1052

