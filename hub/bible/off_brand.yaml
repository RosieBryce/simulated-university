# Brand rules and off-brand plantings. OUT OF WORLD. Never shipped.
#
# The in-world Brand Guide (comms / Brand / Brand Guide 1051 v2.1) is written
# from `rules`. Each planted off-brand file breaks named rules, recorded so
# skill 11 is checkable.

rules:
  naming:
    - id: N1
      rule: 'The institution is "Stonegrove University". Never "the University of Stonegrove", never "Stonegrove Uni", never "Stonegrove College of the Vale".'
    - id: N2
      rule: 'Departments and faculties use their official names as listed in Appendix A. "Department of Healing Arts", "School of Health and Pedagogy" and "Faculty of Pedagogy" were retired in September 1051.'
    - id: N3
      rule: 'Programmes use their validated titles. "Healing and Care" is "Nursing and Care".'
    - id: N4
      rule: 'Students are "students". Not "candidates", "learners" or "young people".'
  logo:
    - id: L1
      rule: The logo is the coat of arms with the wordmark. Use the supplied files only. Never redraw, recolour, stretch, rotate or add effects.
    - id: L2
      rule: Clear space around the logo equals the height of the shield on all sides.
    - id: L3
      rule: Minimum width 30 mm in print, 120 px on screen.
    - id: L4
      rule: No department, programme, team or project may create its own logo, mark or sub-brand. Lock-ups are produced by Communications.
    - id: L5
      rule: Never place the logo on a gradient, a photograph without a solid panel, or any colour outside the palette.
  colour:
    - id: C1
      rule: "Primary palette: Parchment #f5f0e0, Deep Parchment #ede8dc, Stonegrove Navy #1a1a2e, Stonegrove Gold #c9a84c."
    - id: C2
      rule: "Secondary: Grove Green #7a9e82. Accent: Ember Coral #d98878, for highlights only, never for text or backgrounds."
    - id: C3
      rule: No gradients. No drop shadows. No colours outside the palette.
  type:
    - id: T1
      rule: Headings in Playfair Display. Body in Source Sans 3. Where unavailable, Georgia and Arial.
    - id: T2
      rule: Never more than two typefaces on a page. No display, script, rounded or novelty faces.
  voice:
    - id: V1
      rule: Warm, plain, confident. Short sentences. British spelling.
    - id: V2
      rule: No exclamation marks in official communications. One is permitted in a social post.
    - id: V3
      rule: 'Do not use the retired hashtag #CollegeOfTheVale. The hashtag is #Stonegrove.'
  templates:
    - id: P1
      rule: Use the current corporate templates (Communications / Brand / Templates). Templates dated before September 1051 are withdrawn.

appendix_a_official_names:
  - Faculty of Health and Education
  - Department of Health
  - Department of Education
  - Programme Support Team, Nursing and Care
  - Planning and Insight
  - Quality
  - Admissions
  - Student Wellbeing
  - Communications
  - Governance and Secretariat
  - Digital Services

retired_names:
  - {old: "Stonegrove College of the Vale", new: "Stonegrove University"}
  - {old: "School of Health and Pedagogy", new: "Faculty of Health and Education"}
  - {old: "Department of Healing Arts", new: "Department of Health"}
  - {old: "Faculty of Pedagogy", new: "Department of Education"}
  - {old: "Healing and Care", new: "Nursing and Care"}
  - {old: "#CollegeOfTheVale", new: "#Stonegrove"}

