# Filename and path safety rules. OUT OF WORLD, but enforced on everything
# that ships. lint_filenames.py reads this file and fails the build on any
# violation, over the output tree and the manifest.
#
# Assume every learner is on Windows, extracting into a deep Downloads folder.
# A previous test broke the download on punctuation. Be strict.

allowed_characters:
  description: Letters, digits, space, hyphen, underscore, full stop, round brackets. Nothing else.
  regex: "^[A-Za-z0-9 ._()-]+$"
  ascii_only: true

forbidden_anywhere:
  characters: ['<', '>', ':', '"', '/', '\\', '|', '?', '*', "'", '&', ',', '#', '%', '+', ';', '!', '@', '[', ']', '{', '}', '~', '$', '^', '`', '=']
  note: >
    Tilde and dollar are forbidden by default. The only permitted use is the
    lock_files and tmp_litter mess rules, and only after phase 1 proves the
    "~$" prefix round-trips through zip, explorer URL and a Windows
    extraction. Until that flag is set, those rules must use safe names.
  exception_flag: allow_tilde_dollar_prefix
  exception_default: true   # proven in phase 1: ~$ and ~WRL names round-trip through Windows zip and extraction

structure:
  no_leading_space: true
  no_trailing_space: true
  no_leading_dot: true
  no_trailing_dot: true
  no_consecutive_dots: true
  no_consecutive_spaces: true
  max_name_length: 100
  max_path_length_in_zip: 160
  note_on_path_length: >
    Windows MAX_PATH is 260 including the drive and the extraction folder.
    A OneDrive-redirected Downloads folder can be 80 characters before the
    zip's own paths begin, and Windows PowerShell's Expand-Archive has no
    long-path support. 160 keeps 80 + 160 under the limit; tested in phase 3.

case:
  case_insensitive_uniqueness: true
  note: Two names in one folder that differ only by case collide on Windows.

extensions:
  exactly_one: true
  lowercase: true
  allowed: [docx, xlsx, pptx, pdf, txt, csv, vtt, eml, md, png, jpg, tmp]   # tmp only via the tmp_litter mess rule
  not_allowed_and_why:
    dotx: "Rendered as docx; in-world called a template anyway"
    potx: "Rendered as pptx"
    msg: "Proprietary; eml instead"
    json: "Manifest is not inside the tree"
    zip: "Not nested"
  folders_have_no_extension: true
  note: A folder name may contain a full stop (e.g. "v2.1") but must not end in one.

reserved_names:
  windows: [CON, PRN, AUX, NUL, COM1, COM2, COM3, COM4, COM5, COM6, COM7, COM8, COM9, LPT1, LPT2, LPT3, LPT4, LPT5, LPT6, LPT7, LPT8, LPT9]
  applies_to: filename stem (before the extension), case-insensitive, and folder names

explorer:
  url_encode_paths: true
  test_every_allowed_character: true
  note: Phase 1 includes a fixture folder whose names exercise every permitted character and the maximum lengths.

zip:
  root_folder: stonegrove-hub
  readme_at_root: README.txt
  per_site_root: "stonegrove-hub-<site folder_name with spaces replaced by hyphens, lower case>"
  encoding: utf-8 flag set, though all names are ASCII
  timestamps: use the in-world Modified date mapped to a real date in the same relative position (see README, Dates)
