# Control items: correctly handled, so a learner's checker has true negatives
# and true positives to compare against. Not exhaustive; the build marks every
# source document's truth. These are the ones hints may mention.

controls:
  - id: C01
    title: All of Anric's support plans in Support Plans/1052-53
    label: Confidential
    truth: Confidential
    note: Correct. Including the master copy of Grinna Dustshard's plan.
  - id: C02
    title: Grinna Dustshard adjustments summary (one page)
    file: "Adjustments summary G Dustshard.docx"
    site: faculty
    library: fac-teaching-nc
    path: "Year 2/Staff only"
    label: Internal
    truth: Internal
    note: >
      By procedure the one-page summary is shared with teaching staff and is
      Internal. It names the student and lists adjustments but no diagnosis
      or history. A strict learner may argue it should be Confidential;
      the in-world procedure says Internal. The point is that it sits next
      to P01 and looks similar.
  - id: C03
    title: Examination board marks tables
    label: Confidential
    truth: Confidential
    note: Student IDs only, no names; still Confidential by scheme (individual-level).
  - id: C04
    title: Everything in Planning / Reports
    label: Internal
    truth: Internal
    note: Aggregated, no individuals. Correct.
  - id: C05
    title: Everything in Governance / Policies and Procedures / Current
    label: Public
    truth: Public
    note: Correct.

# Expected learner outcome for skill 5, for the guide and the answer key:
# an AI asked to "summarise every document in the Faculty site, skipping
# anything Confidential" and relying on labels alone will read P01, P02, P03,
# P04, P05, P10 and P11. One relying on content will catch most of them. The
# exercise is noticing the difference.
