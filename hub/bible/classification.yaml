# Data classification scheme and ground truth. OUT OF WORLD. Never shipped.
#
# Two things live here:
#   1. The in-world scheme (three labels) that the Data Classification Scheme
#      document in Governance is written from.
#   2. The planted items: files whose assigned label is wrong, missing, or in
#      the wrong place, with the ground truth. The build records these so the
#      hints overlay and any answer key can reference them, and so a learner's
#      guardrails exercise is checkable.
#
# Every source document carries `label` (what the Hub shows) and
# `sensitive: true|false` (ground truth). They are independent on purpose.

scheme:
  labels:
    - id: Public
      colour_token: --elf-green
      definition: >
        Information that can be shared with anyone, inside or outside the
        University, without harm. Published policies, prospectus material,
        regulations, brand assets.
      handling:
        - May be stored anywhere on the Hub.
        - May be sent externally without approval.
        - May be used with any digital tool, including AI tools on or off the
          approved list.
    - id: Internal
      colour_token: --dwarf-gold
      definition: >
        Information for staff use that would cause minor inconvenience or
        embarrassment if disclosed. Committee papers not marked otherwise,
        working documents, internal procedures, aggregated data with no
        individual identifiable.
      handling:
        - Default for anything not otherwise labelled.
        - Share internally as needed; do not send externally without the
          owner's agreement.
        - May be used with AI tools on the approved list only.
    - id: Confidential
      colour_token: --gap-coral
      definition: >
        Information about identifiable individuals (students, applicants,
        staff) or whose disclosure would cause real harm: support plans,
        case notes, fitness to practise files, applicant records, staff
        personal data, reserved committee business, incident reports.
      handling:
        - Store only in a library whose default label is Confidential, or in
          a folder explicitly set to Confidential.
        - Share on a need-to-know basis; never to a distribution list.
        - "Must not be entered into any AI tool, on or off the approved list, without a completed DPIA for that use. (In practice: no.)"
        - Retain per the Records Retention Schedule, then destroy.

  default_label_when_missing: Internal     # what the Hub assumes; the scheme says so

  rule_of_thumb_in_world: >
    If it names a person and says something about them that they would not
    want on a noticeboard, it is Confidential.

