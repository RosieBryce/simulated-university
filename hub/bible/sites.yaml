# Stonegrove Hub site map. OUT OF WORLD. Never shipped.
#
# One entry per SharePoint-style site; each site has document libraries; each
# library has a folder skeleton and a budget. `folder_name` is the on-disk
# name and must pass bible/filename_rules.yaml (so no ampersands). `name` is
# what the explorer displays.
#
# Budgets:  authored = distinct source documents someone writes
#           total    = files in the shipped tree after mess rules are applied
# Per-site totals are the ceiling. The StoneShare migration library is the
# elastic one; everything else should land within 10% of its figure.
#
# mess_profile:  island   convention followed, nothing out of place (one library only)
#                tidy     light version drift, no junk
#                normal   version sprawl, a few junk folders, metadata drift
#                chaotic  everything in mess_rules.yaml applies
#
# `hint` is the fourth-wall text the explorer shows when hints are on.
# Nothing in `hint` ever appears inside the downloadable tree.

snapshot_date: 1053-04-14
