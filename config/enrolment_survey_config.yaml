# Enrolment Survey Configuration
# Annual survey of all enrolled students (all programme years).
# One response per student per academic year; ~82% response rate.
# Output: fact_enrolment_survey.csv

response:
  base_rate: 0.82
  # Low academic engagement nudges non-response (disengaged students skip surveys)
  engagement_modifier: 0.10    # max ±pp shift from engagement; full engagement = +10pp, zero = -10pp

# --- Career thinking constructs ---
# Driven by programme career_prospects, SES, conscientiousness, motivation_career_development
# Strong year-arc: Y1 is lowest, Y3 highest.
career:
  year_arc:                   # additive offset by programme_year (applied before clipping)
    1: -0.50
    2:  0.00
    3:  0.50
  career_prospects_weight: 0.45   # from programme_characteristics.csv (0-1 normalised)
  conscientiousness_weight: 0.40
  motivation_career_development_weight: 0.40
  ses_weight: 0.30                # higher SES -> higher career clarity/confidence
  noise_std: 0.25

# --- Belonging constructs ---
# Driven by social_engagement, SES (inverted), extraversion, disability
# U-shape across years: dip in Y2, partially recovers in Y3
belonging:
  year_arc:
    1:  0.00
    2: -0.30
    3: -0.10
  social_engagement_weight: 0.55
  extraversion_weight: 0.30
  ses_weight: 0.30                # lower SES -> lower belonging (real NSS pattern)
  disability_penalties:
    mental_health_issues:  -0.55
    social_anxiety:        -0.50
    autism_spectrum:       -0.35
  noise_std: 0.28

# --- Academic self-efficacy ---
# Driven by prior_education, conscientiousness, resilience, marks (Y2+), first_gen
academic_self_efficacy:
  prior_education_scores:
    academic:          0.30
    vocational:        0.10
    no_qualifications: -0.25
  conscientiousness_weight: 0.50
  resilience_weight: 0.40
  marks_weight: 0.30              # only applied in Y2 and Y3 (prior-year mean mark, normalised)
  first_gen_penalty: -0.50        # first-generation students start lower
  noise_std: 0.25

# --- Support satisfaction ---
# Driven by academic ability (prior_education + marks), extraversion, base engagement, SES
# No disability modifiers here — support satisfaction is about access, not experience
support_satisfaction:
  prior_education_scores:
    academic:          0.25
    vocational:        0.10
    no_qualifications: -0.20
  extraversion_weight: 0.25
  academic_engagement_weight: 0.40
  ses_weight: 0.25                # lower SES -> slightly less satisfied (access barriers)
  marks_weight: 0.25              # higher-performing students feel more supported
  noise_std: 0.30

# Scale bounds: all items output as float in [1.0, 5.0]
scale:
  min: 1.0
  max: 5.0
  mid: 3.0                        # neutral/base before modifiers
